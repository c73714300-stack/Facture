<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Générateur de facture PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root { --accent:#c00000; --bg:#f4f5f7; --line:#d0d4da; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Arial,sans-serif; background:var(--bg); color:#222; }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  label { font-size:.8rem; color:#555; display:block; margin-bottom:4px; }
  input[type=text], input[type=number] { width:100%; padding:9px; border:1px solid var(--line); border-radius:6px; font-size:1rem; }
  .row { display:grid; grid-template-columns:90px 1fr 1fr 1fr 40px; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid #eee; }
  .row.head { font-weight:600; font-size:.8rem; color:#555; border-bottom:2px solid var(--line); }
  .photo { width:80px; height:80px; border:1px dashed #aaa; border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; background:#fafafa; font-size:.7rem; color:#777; text-align:center; }
  .photo img { max-width:100%; max-height:100%; }
  .total-cell { font-weight:600; text-align:right; }
  button { cursor:pointer; border:0; border-radius:8px; padding:11px 16px; font-size:1rem; }
  .primary { background:var(--accent); color:#fff; }
  .secondary { background:#e8eaee; }
  .del { background:#fde8e8; color:#a00; padding:8px; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .grand { font-size:1.2rem; font-weight:700; text-align:right; margin-top:12px; }
  @media (max-width:640px){
    .row { grid-template-columns:80px 1fr 1fr; }
    .row.head { display:none; }
    .total-cell { grid-column:1 / 3; text-align:left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧾 Générateur de facture PDF</h1>

  <div class="card">
    <label for="contact">Ligne de pied de page (nom de l'entreprise + contact)</label>
    <input type="text" id="contact" value="Keur Ya Amy Fashio : +86 134 3038 5720">
  </div>

  <div class="card">
    <div class="row head"><div>Photo</div><div>Quantité</div><div>Prix unitaire</div><div style="text-align:right">Prix total</div><div></div></div>
    <div id="rows"></div>
    <div class="actions">
      <button class="secondary" id="add">+ Ajouter un produit</button>
    </div>
    <div class="grand">TOTAL : <span id="grand">0</span> FCFA</div>
  </div>

  <div class="actions">
    <button class="primary" id="pdf">📄 Générer le PDF</button>
    <button class="secondary" id="reset">Tout effacer</button>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script>
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
let rows = [];
let pickIndex = null;
const KEY = "facture_data_v1";

function save(){
  try { localStorage.setItem(KEY, JSON.stringify({rows, contact: contact.value})); } catch(e){}
}
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if (d){ rows = d.rows || []; if (d.contact) contact.value = d.contact; }
  } catch(e){}
  if (!rows.length) rows.push(newRow());
}
function newRow(){ return {img:null, w:0, h:0, qty:1, price:0}; }

function render(){
  const box = document.getElementById("rows");
  box.innerHTML = "";
  rows.forEach((r,i)=>{
    const el = document.createElement("div");
    el.className = "row";
    el.innerHTML = `
      <div class="photo" data-i="${i}">${r.img ? `<img src="${r.img}">` : "+ Photo"}</div>
      <div><input type="number" min="0" step="1" value="${r.qty}" data-f="qty" data-i="${i}" inputmode="numeric"></div>
      <div><input type="number" min="0" step="any" value="${r.price||""}" placeholder="0" data-f="price" data-i="${i}" inputmode="numeric"></div>
      <div class="total-cell" id="t${i}">${fmt(r.qty*r.price)}</div>
      <div><button class="del" data-del="${i}" title="Supprimer">✕</button></div>`;
    box.appendChild(el);
  });
  updateTotals();
}
function updateTotals(){
  let g = 0;
  rows.forEach((r,i)=>{ const t = r.qty*r.price; g += t; const c = document.getElementById("t"+i); if(c) c.textContent = fmt(t); });
  document.getElementById("grand").textContent = fmt(g);
  save();
}

document.getElementById("rows").addEventListener("input", e=>{
  const f = e.target.dataset.f; if(!f) return;
  rows[+e.target.dataset.i][f] = parseFloat(e.target.value) || 0;
  updateTotals();
});
document.getElementById("rows").addEventListener("click", e=>{
  const p = e.target.closest(".photo");
  if (p){ pickIndex = +p.dataset.i; document.getElementById("file").click(); return; }
  const d = e.target.closest("[data-del]");
  if (d){ rows.splice(+d.dataset.del,1); if(!rows.length) rows.push(newRow()); render(); }
});
document.getElementById("add").onclick = ()=>{ rows.push(newRow()); render(); };
document.getElementById("reset").onclick = ()=>{ if(confirm("Effacer toute la facture ?")){ rows=[newRow()]; render(); } };
contact.addEventListener("input", save);

document.getElementById("file").addEventListener("change", e=>{
  const f = e.target.files[0]; e.target.value = "";
  if (!f || pickIndex===null) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 300, s = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);
      rows[pickIndex].img = c.toDataURL("image/jpeg",0.8);
      rows[pickIndex].w = c.width; rows[pickIndex].h = c.height;
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
});

document.getElementById("pdf").onclick = ()=>{
  if (!window.jspdf){ alert("La bibliothèque PDF n'a pas pu se charger. Vérifiez la connexion internet."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const body = rows.map(r=>["", String(r.qty), fmt(r.price), fmt(r.qty*r.price)]);
  const total = rows.reduce((s,r)=>s+r.qty*r.price,0);
  const rowH = 26;

  doc.autoTable({
    head: [["PRODUIT","QUANTITE","Prix Unitaire","Prix Total"]],
    body,
    foot: [[{content:"TOTAL", styles:{halign:"center"}}, {content: fmt(total)+" FCFA", colSpan:3, styles:{halign:"center"}}]],
    showFoot: "lastPage",
    theme: "grid",
    margin: {left:14, right:14, top:14, bottom:25},
    styles: {font:"times", fontSize:11, halign:"center", valign:"middle", textColor:0, lineColor:0, lineWidth:0.2, minCellHeight:rowH},
    headStyles: {fillColor:[217,217,217], textColor:0, fontStyle:"bold", minCellHeight:12},
    footStyles: {fillColor:255, textColor:0, fontStyle:"bold", minCellHeight:10},
    didDrawCell: d=>{
      if (d.section==="body" && d.column.index===0){
        const r = rows[d.row.index];
        if (r && r.img){
          const maxW = d.cell.width-8, maxH = rowH-6;
          const k = Math.min(maxW/r.w, maxH/r.h);
          const w = r.w*k, h = r.h*k;
          doc.addImage(r.img, "JPEG", d.cell.x+(d.cell.width-w)/2, d.cell.y+(d.cell.height-h)/2, w, h);
        }
      }
    }
  });

  const n = doc.getNumberOfPages();
  doc.setPage(n);
  const y = Math.min(doc.lastAutoTable.finalY + 14, 285);
  doc.setDrawColor(192,0,0); doc.setLineWidth(0.4);
  doc.line(14, y, 196, y);
  doc.setFont("times","italic"); doc.setFontSize(10);
  doc.text(contact.value, 105, y+5, {align:"center"});

  doc.save("facture.pdf");
};

load(); render();
</script>
</body>
</html>
